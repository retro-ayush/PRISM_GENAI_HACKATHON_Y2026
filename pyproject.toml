[project]
name = "interruptible-agent"
version = "1.0.0"
description = "Interruptible full-duplex voice agent built with LiveKit Agents"
# Competition runtime: Python 3.10-3.12
requires-python = ">=3.10, <3.13"

dependencies = [
    "livekit-agents[silero]~=1.8",
    "livekit-plugins-noise-cancellation>=0.3.2",
    "python-dotenv",
]

[project.optional-dependencies]
# VisionGuide camera process (vision_guide/vision.py)
vision = [
    "opencv-python",
    "ultralytics>=8.4",  # YOLO26 detection + depth models
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# The agent runs as a script (src/agent.py); there is nothing to build.
package = false
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "coordinator",
    "latency_injector",
    "mock_apis",
    "scene",
    "scene_memory",
    "session_metrics",
    "tool_registry",
    "vision_bridge",
    "vision_worker",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
